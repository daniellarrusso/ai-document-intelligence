<h2>{{ title }}</h2>


<div>
  <input
    type="file"
    (change)="onFileSelected($event)"
  />


  <button
    type="button"
    class="bg-sky-500 text-white py-2 px-4 rounded"
    [disabled]="!selectedFile || uploading()"
    (click)="upload()"
  >
    {{ uploading() ? 'Uploading...' : 'Upload' }}
  </button>

 @if (message()) {
      <p>{{ message() }}</p>
    }
</div>
