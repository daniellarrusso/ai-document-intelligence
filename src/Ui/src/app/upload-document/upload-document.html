<h2 class="mb-4 font-semibold text-slate-900">{{ title }}</h2>

<div class="flex flex-wrap items-center gap-3">
  <input
    type="file"
    class="text-sm text-slate-600 file:mr-3 file:rounded-md file:border-0 file:bg-slate-100 file:px-3 file:py-2 file:text-slate-700 hover:file:bg-slate-200"
    (change)="onFileSelected($event)"
  />

  <button
    type="button"
    class="rounded-md bg-sky-600 px-4 py-2 text-sm font-medium text-white hover:bg-sky-700 disabled:cursor-not-allowed disabled:opacity-50"
    [disabled]="!selectedFile() || uploading()"
    (click)="upload()"
  >
    {{ uploading() ? 'Uploading...' : 'Upload' }}
  </button>
</div>

@if (message()) {
  <p class="mt-3 text-sm text-slate-600" role="status">{{ message() }}</p>
}
