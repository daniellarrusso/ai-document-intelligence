services:
  postgres:
    image: postgres:16
    container_name: aidocint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aidocint
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: aidocumentintelligence
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: